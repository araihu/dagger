name: Publish runner image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-runner-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/araihu/dagger:0.21.8
            ghcr.io/araihu/dagger:0.21.8-runner-2.336.0
            ghcr.io/araihu/dagger:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/araihu/dagger
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published CLI
        env:
          IMAGE: ghcr.io/araihu/dagger
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          docker run --rm --entrypoint dagger "$IMAGE@$DIGEST" version \
            | grep --fixed-strings 'dagger v0.21.8'
          printf 'Published `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
